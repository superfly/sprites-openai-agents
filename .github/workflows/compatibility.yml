name: Upstream compatibility

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    name: Latest published dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          openai-agents
          sprites-py
          pytest
          pytest-asyncio
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest
